name: skosprovider_rdf backend tests

on:
  pull_request:
    paths:
      - skosprovider_rdf/**
      - tests/**
      - .github/workflows/skosprovider_rdf.yaml
      - pyproject.toml
      - lockfiles/requirements*.txt

  push:
    branches:
      - master

permissions: {}

jobs:
  test:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
    with:
      runs-on: ubuntu-latest # public repo: no self-hosted runners
      python-versions: '["3.11", "3.12", "3.13.10"]'
      # One lockfile per Python version
      install-command: |
        pip install pip-tools
        pip-sync "lockfiles/requirements-dev-py$PYTHON_VERSION.txt"
        pip install -e .
      lint-command: "" # the old workflow ran no linter
      test-command: pytest tests --exitfirst --capture=no -vvv --full-trace
      coverage: none # the old workflow had no coverage report
