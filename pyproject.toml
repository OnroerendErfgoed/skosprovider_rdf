[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
version = "1.4.0"
name = "skosprovider_rdf"
dynamic = ["readme"]
authors = [
    { name = "Flanders Heritage Agency", email = "ict@onroerenderfgoed.be" },
]
#license = "GPL-3.0-or-later"
description = "skosprovider_rdf"
requires-python = ">=3.11,<3.13"
keywords = ["rdf", "skos", "skosprovider", "vocabularies", "thesauri"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python",
    "Framework :: Pyramid",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "skosprovider>=1.2.0,<2.0.0",
    "rdflib>=6.2.0,<7.0.0",
    "html5lib>=1.1",
]

[project.urls]
History = "https://github.com/OnroerendErfgoed/skosprovider_rdf/blob/master/HISTORY.rst"
Tracker = "https://github.com/OnroerendErfgoed/skosprovider_rdf/issues"
Source = "https://github.com/OnroerendErfgoed/skosprovider_rdf"
Documentation = "https://skosprovider-rdf.readthedocs.io/en/latest/"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "coveralls>=4.0.1",
    "pre-commit",
]

##
# Build tool specific
##
[tool.hatch.build.targets.wheel]
# In the wheel we want to have skosprovider_rdf in the root as python module.
only-include = [
    "/skosprovider_rdf",
]

[tool.hatch.metadata]
# This allows us to use github links as dependencies
allow-direct-references = true

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"
fragments = [
  { path = "README.rst" },
  { path = "HISTORY.rst" },
]

[tool.ruff]
line-length = 90

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-first-party = ["skosprovider_rdf"]

[tool.ruff.format]
quote-style = "single"
